name: WebXR Archery Spike Checks

on:
  push:
    paths:
      - 'projects/webxr-archery-spike/**'
      - '.github/workflows/webxr-archery-spike.yml'
  pull_request:
    paths:
      - 'projects/webxr-archery-spike/**'
      - '.github/workflows/webxr-archery-spike.yml'

jobs:
  source-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/webxr-archery-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Run pure logic unit tests
        run: npm test
      - name: Bundle the static app
        run: npm run build
      - name: Install temporary browser test driver (not a product dependency)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify Chrome availability
        run: google-chrome --version
      - name: Browser smoke test - desktop only
        run: node tests/desktop-smoke.mjs
      - name: Save desktop smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webxr-desktop-smoke-${{ github.run_id }}
          path: projects/webxr-archery-spike/tests/desktop-smoke.png
          if-no-files-found: ignore
