name: WebXR Archery Spike Checks

on:
  push:
    paths:
      - 'projects/webxr-archery-spike/**'
      - '.github/workflows/webxr-archery-spike.yml'
  pull_request:
    paths:
      - 'projects/webxr-archery-spike/**'
      - '.github/workflows/webxr-archery-spike.yml'

jobs:
  source-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/webxr-archery-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (lockfile not yet committed)
        run: npm install
      - name: Show generated dependency lockfile for pinning
        run: |
          echo 'LOCKFILE_BASE64_START'
          base64 -w 0 package-lock.json
          echo
          echo 'LOCKFILE_BASE64_END'
      - name: Run pure logic unit tests
        run: npm test
      - name: Bundle the static app
        run: npm run build
