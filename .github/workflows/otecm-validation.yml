name: OTECM validation

on:
  push:
    branches: [main]
    paths:
      - "schemas/otecm.schema.json"
      - "examples/otecm/**"
      - "tools/otecm/**"
      - "tests/test_otecm.py"
      - ".github/workflows/otecm-validation.yml"
  pull_request:
    paths:
      - "schemas/otecm.schema.json"
      - "examples/otecm/**"
      - "tools/otecm/**"
      - "tests/test_otecm.py"
      - ".github/workflows/otecm-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Validate schema and sample
        run: python tools/otecm/validate.py schemas/otecm.schema.json examples/otecm/sample-record.json
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_otecm.py" -v
